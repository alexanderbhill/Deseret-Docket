name: You're up next alerts

# Every 5 minutes on weekdays during session months (January–March), 7 am to 6 pm Mountain:
# watch today's committee meetings and alert people when the bill before theirs is being heard.
on:
  schedule:
    - cron: "*/5 14-23 * 1-3 1-5"
    - cron: "*/5 0 * 1-3 2-6"
  workflow_dispatch: {}

concurrency: docket-upnext

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check today's meetings
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://deseret-docket.pages.dev' }}
          CRON_KEY: ${{ secrets.CRON_KEY || secrets.CRON_SECRET }}
          LEG_TOKEN: ${{ secrets.LEG_TOKEN }}
        run: python3 -I up_next.py
