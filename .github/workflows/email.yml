name: Send email alerts

# Every 15 minutes: send whatever daily calendar, day-before, end-of-day and new-bill-file emails
# are due. Each subscriber picks their own times; the script only sends what's due right now.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency: docket-email

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send what's due
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://deseret-docket.pages.dev' }}
          CRON_KEY: ${{ secrets.CRON_KEY || secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_KEY" ]; then echo "CRON_KEY isn't set yet; skipping."; exit 0; fi
          python3 -I send_alerts.py
