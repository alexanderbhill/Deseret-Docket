name: Media availability analysis

# Weekdays during session months: every 30 minutes from 10 am to 6 pm Mountain, look for new House and
# Senate media availability videos (and any links an admin pasted on the site), transcribe and summarize
# them, and publish the results to the Daily Updates page. Run by hand with a link from the Actions tab.
on:
  schedule:
    - cron: "15,45 17-23 * 1-3 1-5"
    - cron: "15,45 0 * 1-3 2-6"
  workflow_dispatch:
    inputs:
      url:
        description: "Facebook video link (optional)"
        required: false

permissions:
  contents: write

concurrency: docket-media

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp faster-whisper
      - name: Analyze new recordings
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://deseret-docket.pages.dev' }}
          CRON_KEY: ${{ secrets.CRON_KEY || secrets.CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          if [ -n "$INPUT_URL" ]; then python3 media_avail.py --url "$INPUT_URL"; else python3 media_avail.py; fi
      - name: Publish
        run: |
          git config user.name "docket-bot"
          git config user.email "docket-bot@users.noreply.github.com"
          git add site/data/media-avail.json 2>/dev/null || true
          git commit -m "Media availability analysis $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
